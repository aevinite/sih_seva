<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AeviWork</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #7c5cff;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center; text-align: center;
      }
      .wrap { padding: 24px; max-width: 340px; }
      svg { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { font-size: 1.25rem; margin: 0 0 6px; font-weight: 700; }
      p { margin: 0; opacity: .85; font-size: .95rem; line-height: 1.5; }
      button {
        margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 999px;
        background: #fff; color: #4a32c9; font-weight: 700; font-size: 1rem;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="2" d="M12 4.3 5.2 7.3v5.1c0 4.4 3 7.2 6.8 8.8 3.8-1.6 6.8-4.4 6.8-8.8V7.3z" />
        <path stroke-width="2.4" d="M8.8 12.7l2.4 2.4 4.2-4.7" />
      </svg>
      <h1>You're offline</h1>
      <p>AeviWork needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.href='https://aeviwork-next.vercel.app'">Retry</button>
    </div>
  </body>
</html>
